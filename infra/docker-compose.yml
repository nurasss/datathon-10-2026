# Optional container deployment; native Mac launch: scripts/run_server.sh.
services:
  forte-vision:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      FV_API_KEYS: ${FV_API_KEYS:?Set FV_API_KEYS}
      FV_UI_KEY: ${FV_UI_KEY:-}
      FV_PROJECT_ROOT: /app
      FV_DATA_DIR: /data
      FV_JOB_TIMEOUT_SEC: "280"
      FV_MAX_UPLOAD_MB: "100"
    ports:
      - "8000:8000"
    volumes:
      - forte_vision_data:/data
volumes:
  forte_vision_data:
